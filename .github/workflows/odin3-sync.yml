# Odin 3 upstream sync and assembly
#
# upstream is an exact mirror of armada-os/armada main. Nothing of ours lives
# there, so upstream force-pushing or rewriting history costs us nothing - the
# mirror simply moves to wherever they are now.
#
# Our own files live on the odin3 branch, which shares no history with the
# mirror and is never replayed onto it. This job lays them over the mirror and
# force-pushes the result as main: upstream's tip plus one generated commit.
# Upstream's own build.yml then builds main and publishes :testing, so the image
# pipeline (packages, chunkah, signing, channel tags) stays theirs, unmodified.
#
# Both pushes carry upstream's workflow-file changes, which the job token is not
# allowed to push. ODIN3_PUSH_TOKEN is a fine-grained token on this repository
# with Contents and Workflows read/write. A push made with it also triggers the
# build, which the job token's would not.
name: odin3 sync

on:
  schedule:
    - cron: '23 6 * * *'        # daily; a sync that changes main starts a build
  push:
    branches: [odin3]           # a change to our patches rebuilds straight away
  workflow_dispatch:

concurrency:
  group: odin3-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: mirror and assemble
    runs-on: ubuntu-24.04
    steps:
      - name: Require push token
        env:
          TOKEN: ${{ secrets.ODIN3_PUSH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::ODIN3_PUSH_TOKEN is not set - see the comment at the top of this workflow."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .odin3
          fetch-depth: 1
          persist-credentials: false

      - name: Mirror upstream
        id: mirror
        env:
          TOKEN: ${{ secrets.ODIN3_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git init -q tree && cd tree
          git remote add upstream https://github.com/armada-os/armada
          git remote add fork "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          # Full history without blobs: pushing a shallow commit fails once the
          # fork lacks its parents (after an upstream rewrite); blobs are fetched
          # on demand by the checkout and the push.
          git fetch -q --filter=blob:none upstream main

          NEW=$(git rev-parse FETCH_HEAD)
          OLD=$(git ls-remote fork refs/heads/upstream | cut -f1)
          if [ "${NEW}" != "${OLD}" ]; then
            git push -q --force fork "${NEW}:refs/heads/upstream"
            echo "mirror ${OLD:0:10} -> ${NEW:0:10}"
          else
            echo "mirror already at ${NEW:0:10}"
          fi
          git checkout -q --detach "${NEW}"
          echo "upstream=${NEW}" >> "${GITHUB_OUTPUT}"

      - name: Assemble our files onto the upstream tree
        working-directory: tree
        run: |
          bash ../.odin3/scripts/odin3-assemble.sh ../.odin3
          echo "files that differ from the mirror:"
          git status --short | sed 's/^/  /'

      - name: Publish main
        working-directory: tree
        env:
          UPSTREAM: ${{ steps.mirror.outputs.upstream }}
          ODIN3: ${{ github.sha }}
        run: |
          set -euo pipefail
          git add -A
          git -c user.name=allolive -c user.email=160342668+allolive@users.noreply.github.com \
            commit -q -m "odin3: assemble ${ODIN3:0:10} onto upstream ${UPSTREAM:0:10}" \
            -m "Generated by odin3-sync from the odin3 branch. Do not edit main; change odin3."

          # Same tree as main already has: nothing to build, so do not push.
          NEW_TREE=$(git rev-parse 'HEAD^{tree}')
          OLD_TREE=""
          if git fetch -q --filter=blob:none fork main 2>/dev/null; then
            OLD_TREE=$(git rev-parse 'FETCH_HEAD^{tree}')
          fi
          if [ "${NEW_TREE}" = "${OLD_TREE}" ]; then
            echo "main already carries this tree - no build"
            exit 0
          fi
          git push -q --force fork HEAD:refs/heads/main
          echo "main -> $(git rev-parse --short HEAD); build.yml starts on the push"
